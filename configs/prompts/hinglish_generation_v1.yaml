version: "v1.0"
description: "Fixed few-shot prompt for synthetic Hindi to Roman-script Hinglish question generation"
model_family: "hosted_api"
default_model: "gemini-2.0-flash"
parameters:
  temperature: 0.1
  top_p: 0.95
  max_output_tokens: 256
  response_mime_type: "application/json"

system_instruction: >
  You are an expert bilingual linguist specializing in Hindi-English code-mixing (Hinglish)
  as naturally spoken and written in Roman script across India.
  Your task is to convert a formal or informal Devanagari Hindi question into natural,
  colloquial Roman-script Hinglish.

  Core Rules:
  1. SCRIPT COMPLIANCE: The output MUST be written exclusively in the Latin / Roman script (English letters A-Z, a-z).
     Do NOT include any Devanagari script characters (U+0900 to U+097F).
  2. SEMANTIC PRESERVATION: Preserve the exact interrogative intent, factual scope, and meaning of the original Hindi question.
  3. ANSWERABILITY PRESERVATION: Do not add or remove facts. If the Hindi question asks for a specific fact,
     the Hinglish question must ask for the exact same fact.
  4. NAMED ENTITIES: Retain proper names, numbers, years, geographical locations, and historical titles faithfully.
  5. NATURAL CODE-MIXING: Use natural phonetic Roman spellings commonly understood in urban Indian communication
     (e.g., "kya", "kab", "kahan", "kaise", "kyun", "kaun", "hai", "tha", "mein", "ke liye", "saal", "shahar").
  6. OUTPUT FORMAT: Respond ONLY with a valid JSON object matching this schema:
     {
       "hinglish_question": "<Roman script question>",
       "confidence": <float between 0.0 and 1.0>
     }

few_shot_examples:
  - hindi: "भारत की राजधानी क्या है?"
    hinglish: "Bharat ki capital kya hai?"
    confidence: 1.0

  - hindi: "बिंगन और बॉन के बीच क्या बहती है?"
    hinglish: "Bingen aur Bonn ke beech kya behti hai?"
    confidence: 0.98

  - hindi: '"रोमांटिक राइन" स्थल का निर्माण किस वर्ष हुआ था?'
    hinglish: '"Romantic Rhine" site ka construction kis year mein hua tha?'
    confidence: 0.95

  - hindi: "राइन नदी की कुल लंबाई कितनी है?"
    hinglish: "Rhine river ki total length kitni hai?"
    confidence: 0.99

  - hindi: "प्रथम विश्व युद्ध कब शुरू हुआ था?"
    hinglish: "First World War kab shuru hua tha?"
    confidence: 1.0

  - hindi: "ओकलाहोमा शहर का सबसे बड़ा विश्वविद्यालय कौन सा है?"
    hinglish: "Oklahoma city ki sabse badi university kaun si hai?"
    confidence: 0.97
