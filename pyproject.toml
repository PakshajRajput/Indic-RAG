[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "indicrag"
version = "0.1.0"
description = "PJ-09 IndicRAG-QA: Multi-Agent Abstention-Aware RAG for Hindi/Hinglish QA"
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short --basetemp=scratch/pytest_tmp"
# Fixed seed via conftest.py fixture
